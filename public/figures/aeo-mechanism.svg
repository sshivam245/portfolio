<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 648 312" width="648" height="312" role="img" aria-label="audit queries then entity schema then FAQPage then answer-shaped H2s then geo pages then split tracking then cited">
  <style>
    .ink   { fill: #16161a; }
    .muted { fill: #6b6b72; }
    .accf  { fill: #b4451f; }
    .acc   { stroke: #b4451f; }
    .box   { fill: none; stroke: #cfcec9; stroke-width: 1; }
    .rule  { stroke: #cfcec9; }
    text   { font-family: "IBM Plex Mono", ui-monospace, monospace; }
    .lbl   { font-size: 10px; letter-spacing: 0.08em; }
    .sub   { font-size: 9px; }
    .tiny  { font-size: 8px; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #e8e8e3; }
      .muted { fill: #8a8a93; }
      .accf  { fill: #e8703a; }
      .acc   { stroke: #e8703a; }
      .box, .rule { stroke: #3a3a40; }
    }
  </style>

  <text class="lbl muted" x="8" y="18">THE QUERY</text>
  <rect class="box" x="8" y="30" width="140" height="50"/>
  <text class="sub ink" x="19" y="51">audit queries</text>
  <text class="tiny muted" x="19" y="67">which return AI answers</text>
  <rect class="box" x="172" y="30" width="140" height="50"/>
  <text class="sub ink" x="183" y="51">entity schema</text>
  <text class="tiny muted" x="183" y="67">Organization + local</text>
  <rect class="box" x="336" y="30" width="140" height="50" stroke-width="1.7"/>
  <text class="sub ink" x="347" y="51">FAQPage</text>
  <text class="tiny accf" x="347" y="67">question + liftable answer</text>
  <rect class="box" x="500" y="30" width="140" height="50"/>
  <text class="sub ink" x="511" y="51">answer-shaped H2s</text>
  <text class="tiny muted" x="511" y="67">buyer questions, not labels</text>
  <path class="acc" d="M148 55.0 H166" stroke-width="1"/>
  <path class="accf" d="M172 55.0 l-6 -3 v6 z"/>
  <path class="acc" d="M312 55.0 H330" stroke-width="1"/>
  <path class="accf" d="M336 55.0 l-6 -3 v6 z"/>
  <path class="acc" d="M476 55.0 H494" stroke-width="1"/>
  <path class="accf" d="M500 55.0 l-6 -3 v6 z"/>
  <path class="acc" d="M570.0 80 V118" stroke-width="1"/>
  <path class="accf" d="M570.0 124 l-3 -6 h6 z"/>
  <rect class="box" x="336" y="124" width="140" height="50"/>
  <text class="sub ink" x="347" y="145">geo pages</text>
  <text class="tiny muted" x="347" y="161">Miami / South Florida</text>
  <rect class="box" x="172" y="124" width="140" height="50"/>
  <text class="sub ink" x="183" y="145">split tracking</text>
  <text class="tiny muted" x="183" y="161">AI referrals vs organic</text>
  <rect class="box" x="8" y="124" width="140" height="50"/>
  <text class="sub ink" x="19" y="145">cited</text>
  <text class="tiny muted" x="19" y="161">named in the AI Overview</text>
  <path class="acc" d="M336 149.0 H318" stroke-width="1"/>
  <path class="accf" d="M312 149.0 l6 -3 v6 z"/>
  <path class="acc" d="M172 149.0 H154" stroke-width="1"/>
  <path class="accf" d="M148 149.0 l6 -3 v6 z"/>
  <line class="rule" x1="8" y1="190" x2="640" y2="190" stroke-width="1"/>
  <text class="lbl muted" x="8" y="208">WITHOUT IT</text>
  <text class="sub muted" x="8" y="226">rank, and hope the click survives</text>
  <text class="sub muted" x="8" y="240">the answer box above you</text>
  <text class="lbl accf" x="312" y="208">WITH IT</text>
  <text class="sub ink" x="312" y="226">the source the answer is assembled</text>
  <text class="sub ink" x="312" y="240">from, named in it</text>
  <line class="rule" x1="8" y1="270" x2="640" y2="270" stroke-width="1"/>
  <text class="lbl muted" x="8" y="290">RANKING IS NOT THE GOAL. BEING QUOTED IS.</text>
</svg>
