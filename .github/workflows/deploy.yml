name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # GitHub Pages serves this repo under /portfolio. Vercel serves at a
      # domain root and sets neither of these, so it gets the defaults.
      - run: npm run build
        env:
          # Assets still live under /portfolio here. NEXT_PUBLIC_SITE_URL is
          # deliberately NOT set: this copy inherits the Vercel default, so
          # its canonicals point at the primary site instead of competing
          # with it. Two live copies each declaring themselves canonical is
          # duplicate content, which is a bad look on a site that sells SEO.
          NEXT_PUBLIC_BASE_PATH: /portfolio

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
